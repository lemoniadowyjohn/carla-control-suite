[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8",
    "numpy>=2",
    "pydantic>=2",
]

[project.scripts]
up = "ultimate_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["ultimate_pipeline*", "opendrive_geometry*", "phase_q*"]
exclude = ["tests*"]
