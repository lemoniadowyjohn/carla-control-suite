[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8",
    "numpy>=2",
    "pydantic>=2",
]

[project.optional-dependencies]
geo = [
    "pyproj>=3",
    "rasterio>=1.3",
    "shapely>=2"
]
carla = [
    "torch>=2.9.1",
    "torchvision>=0.24.1"
]
research = [
    "pytest>=7",
    "hypothesis>=6"
]
dev = [
    "pytest>=7",
    "hypothesis>=6",
    "pytest-xdist",
    "build",
    "twine"
]

[project.scripts]
up = "ultimate_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["ultimate_pipeline*", "opendrive_geometry*", "phase_q*"]
exclude = ["tests*"]
