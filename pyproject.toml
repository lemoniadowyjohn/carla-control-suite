[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carla-map-quality-toolkit"
version = "0.1.0"
description = "Sanitized, reproducible quality checks for CARLA/OpenDRIVE map pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michał Dembski"}]
dependencies = [
  "numpy>=1.24",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "build>=1.2,<2",
  "matplotlib>=3.8",
]

[project.scripts]
carla-map-quality = "carla_map_quality_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/carla_map_quality_toolkit"]
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true

[tool.coverage.report]
precision = 2
show_missing = true
