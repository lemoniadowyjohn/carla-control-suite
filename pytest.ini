[pytest]
testpaths = ultimate_pipeline/tests tests tests/unit tests/phase_q tests/carla_tools tests/domain_gap tests/opendrive_geometry tests/quality tests/roadrunner tests/topology ultimate_pipeline/domain_gap/tests ultimate_pipeline/carla_tools/tests ultimate_pipeline/tools/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .pytest_cache __pycache__ build dist outputs submission external work .venv
addopts = -v --tb=short --strict-markers
markers =
    slow: slow running tests
    integration: integration tests
    unit: unit tests
    performance: performance tests
    regression: regression tests
    carla: tests requiring CARLA Python API and a running simulator
    quality: OpenDRIVE quality-gate tests
