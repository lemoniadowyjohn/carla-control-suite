[pytest]
testpaths = ultimate_pipeline/tests tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .pytest_cache __pycache__ build dist outputs submission external work .venv
addopts = -v --tb=short --strict-markers
markers =
    slow: slow running tests
    integration: integration tests
    unit: unit tests
    performance: performance tests
    regression: regression tests
    carla: tests requiring CARLA Python API and a running simulator
    quality: OpenDRIVE quality-gate tests
