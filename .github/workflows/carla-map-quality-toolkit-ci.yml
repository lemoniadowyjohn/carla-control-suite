name: CARLA Map Quality Toolkit CI

on:
  push:
    branches:
      - portfolio/carla-map-quality-toolkit-20260930
    paths:
      - "portfolio/carla-map-quality-toolkit/**"
      - ".github/workflows/carla-map-quality-toolkit-ci.yml"
  pull_request:
    paths:
      - "portfolio/carla-map-quality-toolkit/**"
      - ".github/workflows/carla-map-quality-toolkit-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: portfolio/carla-map-quality-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=carla_map_quality_toolkit --cov-report=term-missing --cov-fail-under=90
      - run: carla-map-quality demo --output out
