name: CARLA Map Quality Toolkit CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - "SANITIZATION.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CARLA_PORTFOLIO_CV_BLOCK.md"
      - ".github/workflows/carla-map-quality-toolkit-ci.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carla-map-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Static type analysis
        if: matrix.python-version == '3.12'
        run: mypy src/carla_map_quality_toolkit
      - name: Unit and regression tests
        run: pytest --cov=carla_map_quality_toolkit --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Enforce coverage gate
        run: coverage report --fail-under=90
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Reproducible package build
        run: python -m build
      - name: PASS-path smoke test
        run: carla-map-quality demo --output out/pass
      - name: Verify intentional rejection path
        shell: bash
        run: |
          set +e
          carla-map-quality demo --inject-failure --output out/failure
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected intentional failure exit code 2; got $code"
            exit 1
          fi
      - name: Upload verification evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: carla-map-quality-verification
          path: |
            coverage.xml
            out/
            dist/
          if-no-files-found: warn
          retention-days: 14
