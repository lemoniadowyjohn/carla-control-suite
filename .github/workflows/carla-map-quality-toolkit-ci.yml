name: CARLA Map Quality Toolkit CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - "SANITIZATION.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CARLA_PORTFOLIO_CV_BLOCK.md"
      - ".github/workflows/carla-map-quality-toolkit-ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=carla_map_quality_toolkit --cov-report=term-missing
      - run: coverage report --fail-under=90
      - run: carla-map-quality demo --output out/pass
      - name: Verify intentional rejection path
        shell: bash
        run: |
          set +e
          carla-map-quality demo --inject-failure --output out/failure
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected intentional failure exit code 2; got $code"
            exit 1
          fi
