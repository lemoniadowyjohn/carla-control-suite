name: offline research gates

on:
  push:
    branches: [main, "stabilize/**", "stable/**", "fix/**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  offline-tests:
    name: offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch/torchvision first
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: pip install -r requirements.txt

      - name: Install package editable for tests
        run: pip install -e .

      - name: Run offline pytest
        run: python -m pytest -q

  package-wheel-smoke:
    name: package / wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install --upgrade pip build
          python -m build --wheel --sdist --outdir dist-ci

      - name: Install wheel into clean venv
        run: |
          python -m venv /tmp/up-wheel-smoke
          /tmp/up-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/up-wheel-smoke/bin/python -m pip install dist-ci/*.whl

      - name: Representative imports
        working-directory: /tmp
        run: |
          /tmp/up-wheel-smoke/bin/python -I - <<'PY'
          import importlib
          mods = [
              "ultimate_pipeline.domain_gap",
              "ultimate_pipeline.domain_gap_gnn",
              "ultimate_pipeline.carla_tools",
              "ultimate_pipeline.quality",
              "ultimate_pipeline.sensors",
              "ultimate_pipeline.topology",
              "ultimate_pipeline.experiments",
              "ultimate_pipeline.tools",
          ]
          for mod in mods:
              importlib.import_module(mod)
          print("IMPORT_SMOKE_OK")
          PY

      - name: Console script and dependency integrity
        run: |
          /tmp/up-wheel-smoke/bin/up --help
          /tmp/up-wheel-smoke/bin/python -I -m pip check

  governance-integrity:
    name: governance integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Run governance tests
        run: python -m pytest tests/unit/test_validate_governance.py ultimate_pipeline/tests/unit/test_pipeline_health_summary.py -q

  thesis-rq-contract:
    name: thesis RQ contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Regenerate and audit C19 RQ tables
        run: python tools/run_c19_assembly.py --out-dir reports/post_audit_hardening/C19_THESIS_ASSEMBLY

      - name: Run contract tests
        run: python -m pytest tests/unit/test_thesis_rq_contract.py tests/unit/test_export_thesis_tables.py tests/unit/test_audit_thesis_topic_contract_current.py -q

  research-provenance:
    name: research provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Validate thesis provenance
        run: python tools/validate_thesis_claim_provenance.py --out reports/post_audit_hardening/C19_THESIS_ASSEMBLY/provenance_validation.json

      - name: Run provenance tests
        run: python -m pytest tests/unit/test_validate_thesis_claim_provenance.py tests/unit/test_evidence_sha256_anchors.py -q

  repository-health:
    name: repository health
    runs-on: ubuntu-latest
    needs:
      - offline-tests
      - package-wheel-smoke
      - governance-integrity
      - thesis-rq-contract
      - research-provenance
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install health dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Write repository health packet
        run: |
          python -m ultimate_pipeline.tools.repo_health \
            --out-dir reports/repo_health/ci \
            --test-result PASS \
            --runtime-status NOT_RUN \
            --runtime-reason "GitHub-hosted offline CI does not run a live CARLA 0.9.16 server."

      - name: Upload health packet
        uses: actions/upload-artifact@v4
        with:
          name: repo-health
          path: reports/repo_health/ci
