name: offline research gates

# V5 / NEW-206 (D18) + NEW-208 (D19) hardening:
#   * every action is pinned to an immutable commit SHA (mutable tags removed)
#   * explicit least-privilege permissions per job
#   * per-job timeouts so a hung runner cannot block the required gate
#   * candidate-aware concurrency so a stale push cannot race a newer one
#   * the release gate now resolves a NAMED gate (D19) instead of relying on the
#     ambiguous overall_status, so a green check is semantically meaningful.

on:
  push:
    # Wave B: review/** and hardening/** are first-class delivery lanes and must
    # trigger the offline gates exactly like the others. Omitting them let the
    # entire production-convergence review lane ship without any CI signal.
    branches:
      - main
      - "stabilize/**"
      - "stable/**"
      - "fix/**"
      - "integration/**"
      - "review/**"
      - "hardening/**"
  pull_request:
  workflow_dispatch: {}

# A superseded run for the same ref is cancelled so only the newest candidate
# can report on a given SHA. `cancel-in-progress: true` is safe here because
# these are short read-only offline gates.
concurrency:
  group: offline-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-tests:
    name: offline tests
    runs-on: ubuntu-latest
    # Phase-2 delta 4: the hermetic Windows suite runs ~30 min; hosted runners
    # are slower and start cold, so 60 min left too little headroom.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Keep scratch off the runner default so a large suite cannot exhaust it.
      TMPDIR: ${{ runner.temp }}/pytest-tmp
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Import authority must be owned by CI, never inherited. An inherited
      # repository-specific PYTHONPATH silently prepends a *different* CARLA
      # checkout to sys.path and the suite then tests the wrong code while
      # reporting green. Record what arrived, then neutralise it for every
      # later step in this job.
      - name: Record and clear inherited PYTHONPATH
        run: |
          echo "inherited PYTHONPATH=[${PYTHONPATH}]"
          echo "PYTHONPATH=" >> "$GITHUB_ENV"

      - name: Install CPU-only torch/torchvision first
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu

      # J10: the CI profile pins the HEADLESS OpenCV provider. The base profile
      # deliberately declares no OpenCV provider at all, so the two mutually
      # exclusive cv2 distributions can never be co-installed here. The YOLO
      # layer (requirements-yolo.txt) is installed with --no-deps because
      # ultralytics hard-requires the GUI distribution `opencv-python` in its
      # metadata; a normal install would pull it in transitively, co-install
      # both providers and fail dependency_conflicts. Every job that installs
      # requirements-ci.txt must do the same.
      - name: Install remaining dependencies (headless profile)
        run: pip install -r requirements-ci.txt

      - name: Install YOLO layer without its transitive GUI OpenCV
        run: pip install --no-deps -r requirements-yolo.txt

      - name: Install package editable for tests
        run: pip install -e .

      # Phase-2 delta 1: fail closed before running any test if a repository
      # module could be supplied by another checkout. Ordering is not accepted
      # as proof -- if any external location can supply the module, collection
      # order could still change which one wins.
      - name: Import-authority preflight (fail closed)
        run: python tools/verify_import_authority.py

      # Phase-2 delta 2: -rs/-rx were absent, so CI could not report which
      # tests skipped or xfailed. That is what made an 18-vs-16 skip
      # discrepancy unreconcilable from the base log. `set -o pipefail` is
      # required: without it `tee` would mask a pytest failure and the job
      # would report green.
      - name: Run offline pytest
        run: |
          set -o pipefail
          mkdir -p ci-artifacts "$TMPDIR"
          python -m pytest -q -p no:cacheprovider -rfEsx 2>&1 \
            | tee ci-artifacts/pytest.log

      # Phase-2 delta 3: retain the pytest log/summary. Previously only the
      # repo-health packet was uploaded, so a failing offline lane left no
      # inspectable evidence behind.
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-log
          path: ci-artifacts/pytest.log
          if-no-files-found: warn

  package-wheel-smoke:
    name: package / wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install --upgrade pip build
          python -m build --wheel --sdist --outdir dist-ci

      - name: Install wheel into clean venv
        run: |
          python -m venv /tmp/up-wheel-smoke
          /tmp/up-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/up-wheel-smoke/bin/python -m pip install dist-ci/*.whl

      # J09: a clean-wheel install must be checked for dependency integrity, not
      # only importability. `pip check` proves the declared metadata resolves.
      - name: Dependency metadata integrity in the clean environment
        run: /tmp/up-wheel-smoke/bin/python -I -m pip check

      - name: Representative imports
        working-directory: /tmp
        run: |
          /tmp/up-wheel-smoke/bin/python -I - <<'PY'
          import importlib
          mods = [
              "ultimate_pipeline.domain_gap",
              "ultimate_pipeline.domain_gap_gnn",
              "ultimate_pipeline.carla_tools",
              "ultimate_pipeline.quality",
              "ultimate_pipeline.sensors",
              "ultimate_pipeline.topology",
              "ultimate_pipeline.experiments",
              "ultimate_pipeline.tools",
          ]
          for mod in mods:
              importlib.import_module(mod)
          print("IMPORT_SMOKE_OK")
          PY

      - name: Console script
        run: /tmp/up-wheel-smoke/bin/up --help

      # J09: the declared extras must be installable. Installing a metadata-only
      # extra does not require CARLA to run -- it only proves the extra graph
      # resolves. The heavyweight 'full' extra is deliberately NOT installed here.
      - name: Optional extras are installable
        run: |
          /tmp/up-wheel-smoke/bin/python -m pip install --dry-run \
            "ultimate-pipeline[geometry,visualization,test] @ file://$PWD/dist-ci/$(basename dist-ci/*.whl)"

      # J10: fail CI if mutually exclusive namespace providers were co-installed.
      - name: Dependency conflict gate
        run: |
          python -c "import sys; sys.path.insert(0,'.'); \
          from ultimate_pipeline.tools.repo_health import dependency_conflicts; \
          import json; r=dependency_conflicts(); print(json.dumps(r, indent=2)); \
          sys.exit(0 if r['status']=='PASS' else 1)"

  governance-integrity:
    name: governance integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install --no-deps -r requirements-yolo.txt
          pip install -e .

      - name: Run governance tests
        run: python -m pytest tests/unit/test_validate_governance.py ultimate_pipeline/tests/unit/test_pipeline_health_summary.py -q

  thesis-rq-contract:
    name: thesis RQ contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install --no-deps -r requirements-yolo.txt
          pip install -e .

      - name: Regenerate and audit C19 RQ tables
        run: python tools/run_c19_assembly.py --out-dir reports/post_audit_hardening/C19_THESIS_ASSEMBLY

      - name: Run contract tests
        run: python -m pytest tests/unit/test_thesis_rq_contract.py tests/unit/test_export_thesis_tables.py tests/unit/test_audit_thesis_topic_contract_current.py -q

  research-provenance:
    name: research provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install --no-deps -r requirements-yolo.txt
          pip install -e .

      - name: Validate thesis provenance
        run: python tools/validate_thesis_claim_provenance.py --out reports/post_audit_hardening/C19_THESIS_ASSEMBLY/provenance_validation.json

      - name: Run provenance tests
        run: python -m pytest tests/unit/test_validate_thesis_claim_provenance.py tests/unit/test_evidence_sha256_anchors.py -q

  # Wave B: offline evidence-graph / freshness validation. Deliberately requires
  # NO live CARLA, NO UE4, NO Blender and NO OSM2World binary, so it runs on
  # GitHub-hosted runners. It refuses to let an evidence packet claim authority
  # over a blocked result, and refuses a closure matrix that names a blocker the
  # readiness matrix does not define.
  offline-evidence-graph:
    name: offline evidence graph / freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          # The evidence matrices are committed evidence; a shallow clone would
          # still resolve the candidate_commit they name, but keep full history
          # so `git cat-file -e <sha>^{commit}` is authoritative.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate evidence / freshness / closure matrices
        run: python tools/verify_offline_evidence_matrix.py

  # D19: the required release check. It resolves the NAMED offline release gate,
  # which exits 0 only when every required offline section is PASS. A runtime
  # status of NOT_RUN no longer forces this to fail (GitHub-hosted CI cannot run
  # CARLA) and no longer lets an INCOMPLETE packet report green.
  offline-release-gate:
    name: offline release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - offline-tests
      - package-wheel-smoke
      - governance-integrity
      - thesis-rq-contract
      - research-provenance
      - offline-evidence-graph
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install health dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install --no-deps -r requirements-yolo.txt
          pip install -e .

      - name: Write repository health packet and resolve the offline release gate
        run: |
          python -m ultimate_pipeline.tools.repo_health \
            --out-dir reports/repo_health/ci \
            --test-result PASS \
            --runtime-status NOT_RUN \
            --runtime-reason "GitHub-hosted offline CI does not run a live CARLA 0.9.16 server." \
            --gate offline-release-gate

      # Uploads the packet but must never mask a gate failure.
      - name: Upload health packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-health
          path: reports/repo_health/ci
