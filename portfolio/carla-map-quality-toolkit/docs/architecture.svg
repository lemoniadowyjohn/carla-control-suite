<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17263f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.26"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9bb7d4"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #f5f7fb; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #b8c7d9; }
      .box { rx: 18; ry: 18; stroke-width: 2; filter: url(#shadow); }
      .bt { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .bs { font: 400 14px Arial, sans-serif; fill: #e6edf5; }
      .edge { stroke: #9bb7d4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .lane { stroke: #526c88; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .badge { font: 700 13px Arial, sans-serif; fill: #d9e8f7; }
    </style>
  </defs>
  <rect width="1400" height="850" fill="url(#bg)"/>
  <text x="70" y="72" class="title">CARLA Map Quality Toolkit</text>
  <text x="70" y="108" class="subtitle">Sanitized validation architecture for OpenDRIVE / OSM geometry, topology and evidence-based gates</text>

  <rect x="70" y="170" width="260" height="150" class="box" fill="#234b6f" stroke="#4f8fc2"/>
  <text x="100" y="215" class="bt">Synthetic / Public Inputs</text>
  <text x="100" y="250" class="bs">OpenDRIVE fixtures (.xodr)</text>
  <text x="100" y="278" class="bs">OSM XML / public extracts</text>
  <text x="100" y="306" class="bs">No proprietary map assets</text>

  <rect x="430" y="160" width="260" height="170" class="box" fill="#285f59" stroke="#58a99b"/>
  <text x="460" y="205" class="bt">I/O + Geometry</text>
  <text x="460" y="240" class="bs">OpenDRIVE / OSM parsing</text>
  <text x="460" y="268" class="bs">Reference-line sampling</text>
  <text x="460" y="296" class="bs">Lane centerline reconstruction</text>

  <rect x="790" y="155" width="260" height="180" class="box" fill="#56426f" stroke="#9572bd"/>
  <text x="820" y="202" class="bt">Spatial Consistency</text>
  <text x="820" y="237" class="bs">CRS transformations</text>
  <text x="820" y="265" class="bs">Axis-order / roundtrip checks</text>
  <text x="820" y="293" class="bs">Deterministic SE(2) alignment</text>
  <text x="820" y="321" class="bs">Alignment residuals</text>

  <rect x="1110" y="170" width="220" height="150" class="box" fill="#6b4b33" stroke="#c18b5a"/>
  <text x="1140" y="215" class="bt">Topology</text>
  <text x="1140" y="250" class="bs">Road links</text>
  <text x="1140" y="278" class="bs">Junction laneLinks</text>
  <text x="1140" y="306" class="bs">Referential integrity</text>

  <path d="M330 245 L430 245" class="edge"/>
  <path d="M690 245 L790 245" class="edge"/>
  <path d="M1050 245 L1110 245" class="edge"/>

  <rect x="250" y="440" width="290" height="170" class="box" fill="#2d506b" stroke="#679abf"/>
  <text x="280" y="487" class="bt">Quantitative Metrics</text>
  <text x="280" y="522" class="bs">Symmetric Hausdorff distance</text>
  <text x="280" y="550" class="bs">Lane-width mean / p95 / max</text>
  <text x="280" y="578" class="bs">Violation fraction</text>

  <rect x="650" y="430" width="300" height="190" class="box" fill="#3b5262" stroke="#7894a5"/>
  <text x="680" y="478" class="bt">Quality Gate</text>
  <text x="680" y="513" class="bs">Threshold evaluation</text>
  <text x="680" y="541" class="bs">Explicit failure reasons</text>
  <text x="680" y="569" class="bs">PASS / FAIL outcome</text>
  <rect x="680" y="585" width="115" height="24" rx="12" fill="#335f4b"/>
  <text x="696" y="602" class="badge">DETERMINISTIC</text>

  <rect x="1060" y="440" width="270" height="170" class="box" fill="#4f3b5e" stroke="#906ba8"/>
  <text x="1090" y="487" class="bt">Evidence &amp; Reporting</text>
  <text x="1090" y="522" class="bs">JSON machine evidence</text>
  <text x="1090" y="550" class="bs">Markdown review report</text>
  <text x="1090" y="578" class="bs">Provenance metadata</text>

  <path d="M900 335 C900 390 470 380 440 440" class="edge"/>
  <path d="M1220 320 C1220 380 880 375 830 430" class="edge"/>
  <path d="M540 525 L650 525" class="edge"/>
  <path d="M950 525 L1060 525" class="edge"/>

  <path d="M200 680 L1200 680" class="lane"/>
  <rect x="370" y="705" width="660" height="82" rx="20" fill="#162f48" stroke="#4b789f" stroke-width="2"/>
  <text x="410" y="740" class="bt">Tests + CI + Regression Fixtures</text>
  <text x="410" y="770" class="bs">Parser • synthetic geometry • CRS • topology • invalid lane links • regression signature • CLI demo</text>
</svg>
